name: Aktivite kartı

# Profil README'sindeki GitHub hareketi kartını 30 dakikada bir yeniden çizer
# ve `output` dalına yazar (ana dalın geçmişi şişmesin diye dal her seferinde
# tek commit olarak yeniden yazılır). Hazır istatistik servislerine bağımlı değil.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/aktivite.mjs'
      - 'scripts/fonts.json'
      - '.github/workflows/aktivite.yml'

permissions:
  contents: write

concurrency:
  group: aktivite
  cancel-in-progress: true

jobs:
  ciz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kartı çiz
        run: node scripts/aktivite.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: output dalına yaz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cikti
          cp assets/aktivite.svg /tmp/cikti/
          cd /tmp/cikti
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aktivite.svg
          git commit -q -m "Aktivite kartı"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
